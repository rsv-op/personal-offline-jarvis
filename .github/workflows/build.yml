name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Run unit tests and assemble debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-offline-jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
