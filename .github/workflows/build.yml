name: Android build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.6
      - name: Run unit tests and assemble debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-build.log
          gradle_status=${PIPESTATUS[0]}
          if [ "$gradle_status" -ne 0 ]; then
            echo "### Gradle failure excerpt" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -iE '(failed|failure|error|exception|what went wrong|caused by|^e: )' gradle-build.log | tail -n 40 | while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              printf '::error title=Gradle failure::%s\n' "$escaped"
            done
          fi
          exit "$gradle_status"
