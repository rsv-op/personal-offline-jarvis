name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the built APK to the 'jarvis-latest' GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ai-matrix:
    name: ai-matrix intent brain (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy and pytest
        run: python -m pip install --upgrade pip numpy pytest

      - name: Run the ai-matrix test suite
        working-directory: ai-matrix
        run: python -m pytest tests -q

      - name: Prove the export pipeline still runs
        # Deliberately not compared byte-for-byte: BLAS reduction order differs between
        # machines, so the pytest suite checks that predictions match instead of weights.
        working-directory: ai-matrix
        run: python -m ai_matrix.cli export --out /tmp/fresh_ai_matrix_model.json

  build:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install the Android 16 platform
        # The runner image already ships an Android SDK; we only add API 36 so the
        # install never depends on a third-party action's availability.
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          TOOL="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$TOOL" ]; then TOOL="$(command -v sdkmanager)"; fi
          "$TOOL" --version
          yes | "$TOOL" --licenses > /dev/null 2>&1 || true
          "$TOOL" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install the Android NDK and CMake
        # The local language model runs on llama.cpp, which is compiled from
        # source by the external native build (app/src/main/cpp/CMakeLists.txt).
        # That needs the NDK and CMake, neither of which is on the runner image.
        #
        # The NDK version is pinned so the native build stays reproducible: a
        # different NDK can change the CPU feature detection and therefore the
        # generated kernels.
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          TOOL="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$TOOL" ]; then TOOL="$(command -v sdkmanager)"; fi
          "$TOOL" --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Report the native toolchain
        # Prints the resolved NDK and CMake versions into the log so a native
        # build failure can be diagnosed from the CI output alone.
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "NDK: $(ls "$SDK/ndk" 2>/dev/null || echo none)"
          echo "CMake: $(ls "$SDK/cmake" 2>/dev/null || echo none)"

      - name: Reuse the debug signing key between runs
        # Without this the runner regenerates its debug keystore every build, and a new
        # APK would refuse to install over the previous one (signature mismatch).
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.6'

      - name: Compile the app and its unit tests
        # Split from the run below on purpose. A single `gradle :app:testDebugUnitTest
        # :app:assembleDebug` invocation hides which of the three phases (compile, test,
        # package) a hang belongs to; when the tests spin, the job sits in one opaque
        # step for hours. Each phase now has its own step and its own timeout, so a
        # stalled test surfaces as a named failure in minutes.
        id: gradle_compile
        timeout-minutes: 45
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:compileDebugKotlin \
            :app:compileDebugUnitTestKotlin 2>&1 | tee /tmp/gradle-compile.log

      - name: Run the plain unit tests
        id: gradle_test
        # The suite is split in two so a wedged Compose composition cannot hide the
        # plain JVM tests (and vice versa). Both halves are cheap on their own; the
        # per-test `--tests` selection below is what keeps the log readable.
        timeout-minutes: 15
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          timeout --signal=QUIT --kill-after=60s 600 \
            gradle --no-daemon --stacktrace :app:testDebugUnitTest \
              --tests 'com.example.voiceassistant.aimatrix.*' \
              --tests 'com.example.voiceassistant.chat.*' \
              --tests 'com.example.voiceassistant.core.*' \
              --tests 'com.example.voiceassistant.generation.*' \
              --tests 'com.example.voiceassistant.memory.*' \
              --tests 'com.example.voiceassistant.nlp.*' \
              --tests 'com.example.voiceassistant.statemachine.*' \
              --tests 'com.example.voiceassistant.stt.*' \
              --tests 'com.example.voiceassistant.telematics.*' \
              --tests 'com.example.voiceassistant.vault.*' \
            2>&1 | tee /tmp/gradle-test.log

      - name: Run the Android-dependent unit tests
        id: gradle_test_android
        # Robolectric + Compose: the half that used to spin forever. It runs as its own
        # step so its log and its timeout are separate from the JVM-only tests.
        timeout-minutes: 20
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          timeout --signal=QUIT --kill-after=60s 900 \
            gradle --no-daemon --stacktrace :app:testDebugUnitTest \
              --tests 'com.example.voiceassistant.orchestrator.*' \
              --tests 'com.example.voiceassistant.rag.*' \
              --tests 'com.example.voiceassistant.ui.*' \
              --tests 'com.example.voiceassistant.wake.*' \
            2>&1 | tee /tmp/gradle-test-android.log

      - name: Assemble the debug APK
        id: gradle_assemble
        timeout-minutes: 45
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug \
            2>&1 | tee /tmp/gradle-assemble.log

      - name: Combine the Gradle logs
        if: always()
        run: |
          # The annotation reporter reads one file; keep its input shape stable.
          : > /tmp/gradle.log
          for f in /tmp/gradle-compile.log /tmp/gradle-test.log /tmp/gradle-test-android.log /tmp/gradle-assemble.log; do
            [ -f "$f" ] && cat "$f" >> /tmp/gradle.log
          done
          wc -l /tmp/gradle.log || true

      - name: Dump the test thread stacks when the tests time out
        # `timeout --signal=QUIT` makes the Gradle daemon-less JVM print a full
        # thread dump, which is the only way to see *which* test is stuck.
        if: failure() && (steps.gradle_test.outcome == 'failure' || steps.gradle_test_android.outcome == 'failure')
        run: |
          echo '=== last 100 lines of the plain test log ==='
          tail -n 100 /tmp/gradle-test.log || true
          echo '=== last 200 lines of the Android test log ==='
          tail -n 200 /tmp/gradle-test-android.log || true
          echo '=== test result XML files (names only) ==='
          find app/build/test-results -name '*.xml' 2>/dev/null | sort || true

      - name: Surface failures as check annotations
        # Gradle logs and artifacts live behind signed storage URLs that cannot always be
        # read back, so the useful lines are republished as check-run annotations. A single
        # annotation is capped at ~4 KB, hence one annotation per failing test class.
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          LIMIT = 3900

          def emit(title, lines):
              if not lines:
                  return
              text = "\n".join(lines)[:LIMIT]
              escaped = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={title}::{escaped}")

          # 1) Compiler and Gradle errors.
          log = pathlib.Path("/tmp/gradle.log")
          if log.is_file():
              pattern = re.compile(
                  r"(^e: |^> Task .*FAILED|error:|Execution failed|Caused by:|Unresolved reference|"
                  r"Could not (resolve|find)|is not a function|^\* What went wrong)"
              )
              emit(
                  "Gradle failure digest",
                  [line for line in log.read_text(errors="replace").splitlines() if pattern.search(line)],
              )

          # 2) Test failures, grouped by class.
          results = pathlib.Path("app/build/test-results/testDebugUnitTest")
          by_class = {}
          if results.is_dir():
              for report in sorted(results.glob("*.xml")):
                  try:
                      tree = ET.parse(report)
                  except Exception:
                      continue
                  for case in tree.iter("testcase"):
                      problems = list(case.findall("failure")) + list(case.findall("error"))
                      if not problems:
                          continue
                      name = f"{case.get('classname')}.{case.get('name')}"
                      detail = [name]
                      for problem in problems:
                          message = (problem.get("message") or problem.get("type") or "failed").strip()
                          detail.append("  " + message.replace("\n", " ")[:600])
                          body = (problem.text or "").strip().splitlines()
                          detail.extend("    " + line.strip()[:200] for line in body[1:4])
                      by_class.setdefault(report.stem, []).extend(detail)

          for index, (cls, lines) in enumerate(sorted(by_class.items())):
              if index >= 12:
                  break
              emit(f"Test failures {cls[:80]}", lines)
          PY

      - name: Post the sherpa-onnx AAR listing to the PR
        # The CI log archive is hosted on storage that the agent
        # sandbox cannot read back. To debug the
        # `extractSherpaJniLibs` task we need to see the actual
        # on-disk layout inside the AAR. `extractSherpaJniLibs`
        # writes the listing to app/build/sherpa-jni/
        # aar-listing.txt (in addition to printing it). This
        # step posts the listing as a PR comment so the agent
        # can read it via the GitHub API. Marked
        # `continue-on-error` because it's a debug aid, not a
        # build requirement: a PR-comment failure should never
        # mask a green build.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LISTING="app/build/sherpa-jni/aar-listing.txt"
          echo "checking for AAR listing at $LISTING"
          ls -la "$LISTING" 2>&1 || true
          if [ ! -s "$LISTING" ]; then
            echo "no AAR listing at $LISTING; extractSherpaJniLibs did not run or did not write the file"
            exit 0
          fi
          # A PR comment is capped at 65 535 chars. The AAR
          # listing is well under that, but truncate defensively.
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          pr_number = os.environ.get("PR_NUMBER", "")
          if not pr_number:
              print("PR_NUMBER is empty (not a pull_request run); skipping PR comment.")
              import sys
              sys.exit(0)

          listing = pathlib.Path("app/build/sherpa-jni/aar-listing.txt").read_text(errors="replace")
          truncated = listing if len(listing) <= 60_000 else listing[:60_000] + "\n...[truncated]"

          body = (
              "## sherpa-onnx AAR listing (from `extractSherpaJniLibs`)\n\n"
              "```\n" + truncated + "\n```\n"
          )
          result = subprocess.run(
              ["gh", "pr", "comment", pr_number, "--body", body],
              check=False,
          )
          if result.returncode != 0:
              print(f"gh pr comment failed (rc={result.returncode}); the listing is still in the build log")
          PY

      - name: Verify the built APK
        # Proves the shipped artifact really is the offline assistant: right package, right
        # SDK levels, phone ABIs, no INTERNET permission, model asset present. The findings
        # are republished as a check annotation so they survive the log retention window.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)"
          SIGNER="$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          "$SIGNER" verify --print-certs "$APK" > /tmp/certs.txt 2>&1 || true
          echo "--- badging ---"; cat /tmp/badging.txt
          echo "--- certificates ---"; cat /tmp/certs.txt
          APK_PATH="$APK" python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import zipfile

          badging = pathlib.Path("/tmp/badging.txt").read_text(errors="replace")
          certs = pathlib.Path("/tmp/certs.txt").read_text(errors="replace")
          apk = os.environ["APK_PATH"]

          # aapt2 has shipped more than one spelling for the SDK levels over the years
          # (`sdkVersion:'26'`, `minSdkVersion='26'`, and the same for the target), so the
          # levels are collected line by line instead of trusting one exact format.
          levels = {}
          for line in badging.splitlines():
              match = re.match(r"\s*([A-Za-z]+)\s*[:=]\s*'?(\d+)\s*'?\s*$", line.strip())
              if match:
                  levels.setdefault(match.group(1), match.group(2))

          def find(pattern, text=badging):
              match = re.search(pattern, text, re.M)
              return match.group(1) if match else None

          min_sdk = levels.get("sdkVersion") or levels.get("minSdkVersion")
          target_sdk = levels.get("targetSdkVersion")
          compile_sdk = find(r"compileSdkVersion\s*[:=]\s*'?(\d+)")
          package = find(r"^package: (.*)$")
          version = find(r"versionName='([^']*)'")
          code = find(r"versionCode='([^']*)'")
          abis = find(r"^native-code: (.*)$")
          permissions = re.findall(r"uses-permission: name='([^']+)'", badging)
          sdk_lines = [l.strip() for l in badging.splitlines() if re.match(r"^(min|target|compile)?sdkVersion", l.strip(), re.I)]

          findings = [
              f"package: {package or 'MISSING'} (versionCode {code or '?'}, versionName {version or '?'})",
              f"compile {compile_sdk or '?'} / min {min_sdk or '?'} -> target {target_sdk or '?'}",
              "badging levels: " + (", ".join(sdk_lines) or "none"),
              f"native-code: {abis or 'none'}",
              "uses-permission: " + (", ".join(sorted(permissions)) or "none"),
          ]

          problems = []
          if not package or "com.example.voiceassistant" not in package:
              problems.append("unexpected or missing package name")
          if target_sdk != "36":
              problems.append(f"targetSdkVersion parsed as {target_sdk!r}, expected 36")
          if compile_sdk != "36":
              problems.append(f"compileSdkVersion parsed as {compile_sdk!r}, expected 36")
          if min_sdk != "26":
              problems.append(f"minSdkVersion parsed as {min_sdk!r}, expected 26")
          if "android.permission.INTERNET" in permissions:
              problems.append("INTERNET permission is present; the assistant must stay offline")
          if not abis or "arm64-v8a" not in abis:
              problems.append("arm64-v8a native code is missing; the APK would not install on a modern phone")

          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              model = archive.getinfo("assets/ai_matrix_model.json") if "assets/ai_matrix_model.json" in names else None
              findings.append(
                  "assets/ai_matrix_model.json: " + (f"{model.file_size} bytes" if model else "MISSING")
              )
              if model is None:
                  problems.append("the ai-matrix model asset is missing from the APK")
              for abi in ("arm64-v8a", "armeabi-v7a"):
                  libs = [n for n in names if n.startswith(f"lib/{abi}/") and n.endswith(".so")]
                  findings.append(f"lib/{abi}: {len(libs)} .so files")
                  if not libs:
                      problems.append(f"no native libraries for {abi}")

              # The llama.cpp JNI bridge must be present for arm64-v8a. This is
              # the library the whole on-device language model runs through, so
              # a missing one means the APK cannot answer open-ended questions.
              llama_lib = "lib/arm64-v8a/libjarvis_llama.so"
              if llama_lib in names:
                  info = archive.getinfo(llama_lib)
                  findings.append(
                      f"{llama_lib}: {info.file_size} bytes"
                  )
                  if info.file_size < 100_000:
                      problems.append(
                          f"{llama_lib} is suspiciously small ({info.file_size} bytes); "
                          "the llama.cpp bridge did not link its native code"
                      )
              else:
                  problems.append(
                      f"{llama_lib} is missing; the on-device language model cannot run"
                  )

              # 32-bit must NOT ship the llama.cpp bridge: its CMake
              # configuration only builds arm64-v8a, and a stray 32-bit copy
              # would mean the ABI restriction had been bypassed.
              if "lib/armeabi-v7a/libjarvis_llama.so" in names:
                  problems.append(
                      "lib/armeabi-v7a/libjarvis_llama.so is present; the llama.cpp "
                      "path is arm64-v8a only"
                  )

          # apksigner labels signers "Signer #1 certificate DN:" on older build-tools and
          # "V2 Signer: certificate DN:" on newer ones, so only the tail is matched.
          signer = re.search(r"certificate DN:\s*(.+)", certs)
          if signer:
              findings.append("signed by: " + signer.group(1).strip())
          else:
              findings.append("signature: NOT VERIFIED - " + " ".join(certs.split())[:200])
              problems.append("apksigner could not confirm a valid signature")

          print("::notice title=APK verification::" + " | ".join(findings).replace("%", "%25"))
          for problem in problems:
              print(f"::error title=APK verification::{problem}")
          if problems:
              sys.exit(1)
          PY

      - name: Collect build outputs
        run: |
          mkdir -p build-outputs
          cp app/build/outputs/apk/debug/app-debug.apk build-outputs/jarvis-offline-debug.apk
          ls -lh build-outputs

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: personal-offline-jarvis-apk
          path: build-outputs/jarvis-offline-debug.apk
          if-no-files-found: error

      - name: Upload the test reports
        # Runs even when the suite fails, so the reports can be inspected afterwards.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Publish (or refresh) the installable release
        # Pull requests get a read-only token, so only publish for main/tags/manual runs.
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="jarvis-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build-outputs/jarvis-offline-debug.apk --clobber
          else
            gh release create "$TAG" build-outputs/jarvis-offline-debug.apk \
              --title "JARVIS offline assistant (latest APK)" \
              --notes "Signed debug APK built from ${{ github.sha }} on ${{ github.ref_name }}. Download it on your phone and tap it to install (allow installs from this source when Android asks). Everything in the app runs offline: no INTERNET permission. The speech model and the optional reply model are imported by you from local files." \
              --target "${{ github.sha }}"
          fi
