name: JARVIS Android Build

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "jarvis-android/**"
      - "docs/architecture/**"
      - ".github/workflows/android-build.yml"
      - "FORGE_STATE.json"
  pull_request:
    paths:
      - "jarvis-android/**"
      - ".github/workflows/android-build.yml"
      - "FORGE_STATE.json"

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run JVM unit tests
        working-directory: jarvis-android
        run: gradle testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        working-directory: jarvis-android
        run: gradle assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s jarvis-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: jarvis-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
