name: JARVIS Android Build

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "jarvis-android/**"
      - "docs/architecture/**"
      - ".github/workflows/android-build.yml"
      - "FORGE_STATE.json"
      - "README.md"
      - ".gitignore"
  pull_request:
    paths:
      - "jarvis-android/**"
      - ".github/workflows/android-build.yml"
      - "FORGE_STATE.json"
      - "README.md"
      - ".gitignore"

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate, Test, and Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "FORGE_STATE.json"
            "README.md"
            ".gitignore"
            ".github/workflows/android-build.yml"
            "docs/architecture/ADR-0001-local-first-android-core.md"
            "jarvis-android/settings.gradle"
            "jarvis-android/build.gradle"
            "jarvis-android/gradle.properties"
            "jarvis-android/app/build.gradle"
            "jarvis-android/app/proguard-rules.pro"
            "jarvis-android/app/src/main/AndroidManifest.xml"
            "jarvis-android/app/src/main/java/ai/arena/jarvis/MainActivity.java"
            "jarvis-android/app/src/test/java/ai/arena/jarvis/BuildSanityTest.java"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required file is missing or empty"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Validate JSON state file
        run: python3 -m json.tool FORGE_STATE.json > /dev/null

      - name: Validate Gradle and SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'rootProject.name = "JARVIS"' \
            jarvis-android/settings.gradle

          grep -Fq 'include(":app")' \
            jarvis-android/settings.gradle

          grep -Fq 'com.android.application" version "8.9.2"' \
            jarvis-android/build.gradle

          grep -Fq 'namespace "ai.arena.jarvis"' \
            jarvis-android/app/build.gradle

          grep -Fq 'applicationId "ai.arena.jarvis"' \
            jarvis-android/app/build.gradle

          grep -Fq 'compileSdk 35' \
            jarvis-android/app/build.gradle

          grep -Fq 'minSdk 26' \
            jarvis-android/app/build.gradle

          grep -Fq 'JavaVersion.VERSION_17' \
            jarvis-android/app/build.gradle

          grep -Fq 'junit:junit:4.13.2' \
            jarvis-android/app/build.gradle

          grep -Fq 'android:name=".MainActivity"' \
            jarvis-android/app/src/main/AndroidManifest.xml

          grep -Fq 'android:exported="true"' \
            jarvis-android/app/src/main/AndroidManifest.xml

          echo "Required configuration checks passed."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Gradle version
        working-directory: jarvis-android
        run: gradle --version

      - name: Run JVM unit tests
        working-directory: jarvis-android
        run: gradle testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        working-directory: jarvis-android
        run: gradle assembleDebug --no-daemon

      - name: Verify debug APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          apk="jarvis-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          ls -lh "$apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: jarvis-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
